polling:
  interval_seconds: 2.5
  jitter_ms: 500

binance_web:
  cookie: ""
  csrf_token: "3f2872723887ff542f32754a4fd2b821"
  fvideo_id: ""
  bnc_uuid: ""
  device_info: ""
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

# `hybrid` uses fast HTTP polling and refreshes its authentication from the
# persistent browser profile after an HTTP auth failure and on a schedule.
# The profile directory contains a login credential; never commit or share it.
binance_source:
  type: "hybrid" # "http", "browser", or "hybrid" (recommended)
  browser:
    profile_dir: "data/binance-browser-profile"
    # The service runs without a graphical display. Use binance_browser_login.sh
    # for interactive login through the VNC desktop.
    headless: true
    timeout_ms: 30000
  session:
    refresh_interval_hours: 36

leaders:
  - name: "ExampleTrader"
    portfolio_id: "4746642567314945281"
    coefficient: 1.0
    total_margin: 50000
    enabled: true
    # Symbols skipped for this leader (case-insensitive), e.g. [BTCUSDT]
    symbol_blacklist: []
    # 交易员后入（限价单）：开启后，收到该 leader 的开仓(OPEN)信号时不立即市价开仓，
    # 而是挂一张价格更优的限价单——买入价 = leader 开仓价 × (1 - offset%)，
    # 卖出价 = leader 开仓价 × (1 + offset%)。仅开仓生效，加/减/平仓仍即时执行；
    # 限价单未成交期间，该 leader 后续的加/减/平仓信号会被跳过（我们无仓位，不做操作）。
    late_entry_enabled: false
    late_entry_offset_pct: 0.2

execution:
  exchange: "bitget"
  api_key: "YOUR_BITGET_API_KEY"
  api_secret: "YOUR_BITGET_API_SECRET"
  api_passphrase: "YOUR_BITGET_API_PASSPHRASE"

risk:
  blacklist: []
  conflict_resolution: "skip"
  # Optional: use a fixed USDT balance for OPEN/INCREASE sizing.
  # Leave null to use the live Bitget account equity.
  fixed_balance_usdt: null

notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

logging:
  level: "INFO"
  file: "logs/app.log"
  max_size_mb: 50
  backup_count: 5

health_database:
  path: "data/health.db"
